<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#000"/>
  <defs>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
    </filter>
    <g id="message" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <text x="128" y="98">Click the Strava Heatmap</text>
      <text x="128" y="122">extension icon to log into</text>
      <text x="128" y="146">Strava and enable the</text>
      <text x="128" y="170">heatmap.</text>
    </g>
  </defs>
  <use href="#message" fill="#404040" stroke="#404040" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)"/>
  <use href="#message" fill="none" stroke="#808080" stroke-width="3" stroke-linejoin="round"/>
  <use href="#message" fill="#fff"/>
</svg>
